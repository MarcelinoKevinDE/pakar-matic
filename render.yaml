services:
  - type: web
    name: pakar-matic
    runtime: php
    buildCommand: "composer install --no-dev --optimize-autoloader && npm install && npm run build && php artisan migrate --force"
    startCommand: "/usr/bin/php -S 0.0.0.0:$PORT -t public public/index.php"
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generate: true